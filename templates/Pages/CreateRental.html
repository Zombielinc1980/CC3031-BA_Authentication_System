<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../static/CreateRental.css">
    <title>Create Rental</title>
</head>
<body>
    <div class="container">
        <h1>Rental Stuff LLC</h1>
        <h2>Create Rental</h2>
        <form method="POST">
            {% if errors %}
                <ul class="errors">
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                    </ul>
            {% endif %}

            {% if user.access != "customer" %}
                <div>
                    <label for="customer_id">Enter the ID of the customer</label>
                    <input type="text" id="customer_id" name="customer_id" required>
                </div>
            {% endif %}

            <div>
                <label for="equipment_id">Select Equipment</label>
                <select name="equipment_id" id="equipment_id" required>
                    {% for e in equipment %}
                        <option value="{{ e.id }}">
                            {{ e.name }} (${{ e.price }}) - Stock: {{ e.stock }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="1" required>
            </div>

            <button>Submit Rental</button>
        </form>

        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</body>
</html>
